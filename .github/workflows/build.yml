name: Build from zip
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip newest zip
        run: |
          ZIP=$(ls *.zip | sort -V | tail -1)
          mkdir work && unzip -q "$ZIP" -d work
          ROOT=$(dirname "$(find work -name build.gradle | head -1)")
          echo "ROOT=$ROOT" >> $GITHUB_ENV
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Build
        run: gradle build --no-daemon
        working-directory: ${{ env.ROOT }}
      - uses: actions/upload-artifact@v4
        with:
          name: servant_addon-jar
          path: ${{ env.ROOT }}/build/libs/*.jar
